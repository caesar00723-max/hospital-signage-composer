name: Deploy Web Form to Pages

on:
  push:
    branches: [main]
    paths:
      - "web/**"
  workflow_dispatch:

permissions:
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      - name: Pages 설정
        uses: actions/configure-pages@v5

      - name: 캐시 버스팅 (app.js에 커밋 SHA 버전 쿼리 삽입)
        run: sed -i "s/app\.js\"/app.js?v=${{ github.sha }}\"/" web/index.html

      - name: web/ 폴더를 Pages 아티팩트로 업로드
        uses: actions/upload-pages-artifact@v3
        with:
          path: "web"

      - name: Pages 배포
        id: deployment
        uses: actions/deploy-pages@v4
